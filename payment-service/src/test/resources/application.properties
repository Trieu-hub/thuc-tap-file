# Tests: several cached application contexts can be alive at once, so the gRPC server binds a free
# port instead of 9090. Tests that call it read the port from GrpcServerStartedEvent.
spring.grpc.server.port=0

# Tests that do not use Kafka start no Kafka listener and do not create topics, so they neither wait
# for a broker nor depend on one. Kafka tests turn both back on in their @SpringBootTest properties.
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
