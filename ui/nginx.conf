# Serves the static UI and proxies /api/ to order-service, so the browser sees one origin (no CORS, D15).
server {
    listen 80;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://order-service:8080;
        proxy_set_header Host $host;
    }
}
