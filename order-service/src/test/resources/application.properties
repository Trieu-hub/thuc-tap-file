# Tests that do not use Kafka start no Kafka listener and do not create topics, so they neither wait
# for a broker nor depend on one. Kafka tests turn both back on in their @SpringBootTest properties.
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false

# Tests that do not use Redis point to a port where nothing listens, so they never write into the
# Redis of a running docker compose sandbox; the code falls back to MySQL (D12). Redis tests override
# host and port with @ServiceConnection.
spring.data.redis.port=1
