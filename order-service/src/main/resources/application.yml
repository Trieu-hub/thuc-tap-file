# Defaults target a local run against `docker compose` infrastructure (MySQL on host port 3307).
# Inside Docker, docker-compose.yml overrides them with SPRING_* environment variables.
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3307/order_db
    username: order_svc
    password: order_demo_pwd
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema (CLAUDE.md 2.3)
  jackson:
    property-naming-strategy: SNAKE_CASE   # REST body and contracts/schemas use snake_case
  rabbitmq:
    host: localhost
    username: sandbox
    password: sandbox_demo_pwd
    template:
      # convertSendAndReceive returns null after this, it does not throw (D7). Default is 5000.
      reply-timeout: 3000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: com.sandbox.order.observability.SandboxJsonLogFormatter
